name: Metrics embed
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-metrics
  cancel-in-progress: false
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # ephemeral workflow token: verified green on Nov 4-5 schedules;
          # secrets.METRICS_TOKEN no longer exists -> "Bad credentials"
          token: ${{ github.token }}
          user: lanshi17
          template: classic
          base: header, activity, community, repositories, metadata
          # "Asia/Changsha" is not a valid IANA zone: it silently fell back to UTC
          config_timezone: Asia/Shanghai
