name: Coding time

on:
  schedule:
    - cron: "20 3 * * *" # 11:20 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-wakatime
  cancel-in-progress: false

jobs:
  wakatime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render coding-time block
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/wakatime_block.py

      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update coding-time stats"
          git push
